<style>
:root{--hh:70px;--rh:22px;--fg:#00A95C;--fy:#FFD700;--fr:#D01C1F;--g9:#00432a;--g8:#005c37;--g7:#007a45;--g5:#00A95C;--g2:#c4e8d6;--g1:#e9f6ef;--gold:#FFD700;--gold2:#FFE45C;--gold1:#fff8d1;--goldt:#8a6d00;--red0:#D01C1F;--red:#B91A1D;--red1:#fdecea;--bg:#f2f5f3;--ink:#17261e;--mut:#5f7367;--line:#d6e0d9;--amb:#8a5300;--amb1:#fff2d6;--r:6px;--sh:0 1px 3px rgba(15,61,40,.10),0 4px 14px rgba(15,61,40,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;line-height:1.65;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.4}
h2{font-size:1.15rem;color:var(--g8);border-right:4px solid var(--gold);padding-right:10px}
h3{font-size:1rem;color:var(--g8)}
small,.mut{color:var(--mut)}small{font-size:.8rem}
.c{text-align:center}.grow{flex:1;min-width:0}
a{color:var(--g7)}
/* ===== الترويسة الرسمية (ألوان العلم الوطني) ===== */
.top{position:sticky;top:0;z-index:30}
.ribbon{background:var(--gold1);color:#5a4500;text-align:center;font-size:.72rem;font-weight:700;padding:0 8px;height:var(--rh);line-height:var(--rh);border-bottom:1px solid #ecd48a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar{height:var(--hh);display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#008a4c,#006a3b);color:#fff;padding:5px 12px 0;border-top:5px solid var(--fr)}
.band{height:7px;background:linear-gradient(to bottom,var(--fy) 0 2px,var(--fr) 2px 100%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img,.brand svg{flex:none}
.bt{min-width:0;line-height:1.3}
.bt small{display:block;color:#e6f6ed;font-size:.64rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small i{display:block;font-style:normal;color:var(--fy);font-weight:700;letter-spacing:.2px}
.bt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Amiri','Cairo',serif;font-size:.93rem}
.bt em{display:none;font-style:normal;color:#d9f1e3;font-size:.7rem}
.usr{display:none;align-items:center;gap:10px;font-size:.85rem}
.usr b{display:block;line-height:1.2}.usr small{color:#d9f1e3}
.ib{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;width:42px;height:42px;font-size:1.3rem;cursor:pointer;flex:none;transition:background .15s}
.ib:active{background:rgba(255,255,255,.28)}
.out{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
.lng{background:var(--fy);color:#2f2400;border:0;border-radius:6px;min-width:36px;height:32px;padding:0 6px;font-weight:800;font-size:.78rem;cursor:pointer;flex:none;font-family:'Cairo',sans-serif;letter-spacing:.3px}
.lng:active{filter:brightness(.92)}
main{max-width:1020px;margin:0 auto;padding:14px 12px 24px}
.foot{text-align:center;color:var(--mut);font-size:.76rem;padding:14px 10px 28px;border-top:3px double var(--g2);margin-top:10px}
.foot b{color:var(--g8);display:block}
html[dir] .foot.lfoot{margin-left:0!important;margin-right:0!important;max-width:none} /* تذييل صفحة الدخول: لا قائمة جانبية هنا فلا يُحجز لها هامش */
/* ===== مكونات ===== */
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.kpi .ic{font-size:1.35rem;display:block;line-height:1.3}.kpi b{display:block;font-size:1.75rem;color:var(--g7);line-height:1.2;font-family:'Cairo',sans-serif}
.kpi small{display:block}.kpi em{display:block;font-style:normal;font-size:.72rem;color:var(--mut)}
.kpi.warn{border-top-color:var(--red0)}.kpi.warn b{color:var(--red)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--g8),var(--g9));color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh);border-bottom:4px solid var(--gold)}
.banner h2{color:#fff;border:0;padding:0;margin:0;font-size:1.25rem;font-family:'Amiri','Cairo',serif}
.banner small{color:#d6ebdd}.banner small.g{color:var(--gold2);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--g1);color:var(--g8);min-height:42px;transition:transform .08s,filter .15s,box-shadow .15s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.pri{background:var(--g7);color:#fff;box-shadow:0 2px 6px rgba(0,122,69,.3)}.btn.dan{background:var(--red);color:#fff}
.btn.sec{background:#fff;color:var(--g8);border:1px solid var(--g2)}
.btn.gold{background:var(--gold);color:#2f2400}.btn.sm{padding:5px 10px;min-height:34px;font-size:.85rem}.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.ok.on{background:var(--g7);color:#fff;border-color:var(--g7)}.btn.no.on{background:var(--red);color:#fff;border-color:var(--red)}.btn.ab.on{background:var(--amb);color:#fff;border-color:var(--amb)}
.cxrow{border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
.cxb{display:flex;gap:6px;margin-top:8px}.cxb .btn{flex:1;padding:4px 6px;min-height:38px;font-size:.84rem}.cxrow .chk{display:flex;margin-top:6px}
details summary{cursor:pointer;padding:4px 0}
textarea{resize:vertical;line-height:1.7}
.lnk{background:none;border:0;color:var(--g7);font-weight:700;cursor:pointer;padding:0;text-align:right}
.chip{display:inline-block;background:var(--g1);color:var(--g8);border-radius:20px;padding:1px 10px;font-size:.78rem;font-weight:600;margin:2px 0 2px 4px;white-space:nowrap}
.chip.ok{background:#dff3e6;color:#14532d}.chip.warn{background:var(--amb1);color:var(--amb)}.chip.red{background:var(--red1);color:var(--red)}.chip.new{background:var(--red0);color:#fff}
.badge{background:var(--red0);color:#fff;border-radius:20px;font-size:.72rem;padding:0 8px;margin-right:6px;font-weight:700;line-height:1.6}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{background:var(--g8);color:#fff;text-align:right;padding:8px;font-weight:700;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:#f8fbf9}
tr:last-child td{border-bottom:0}
table.kv th{background:var(--g1);color:var(--g8);width:34%}
.stk th{white-space:normal;text-align:center;min-width:58px;line-height:1.3;padding:8px 4px}.stk td{padding:6px 4px;text-align:center}
.stk th:nth-child(2),.stk td:nth-child(2){position:sticky;right:0;z-index:1;box-shadow:-2px 0 4px rgba(0,0,0,.06);white-space:nowrap;min-width:140px;text-align:right}
.stk th:nth-child(2){background:var(--g8)}
.stk td:nth-child(2){background:#fff}.stk tbody tr:nth-child(even) td:nth-child(2){background:#f8fbf9}
.fld{display:block;margin-bottom:10px}.fld>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:3px;color:var(--g8)}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-height:42px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g5);box-shadow:0 0 0 3px rgba(0,169,92,.18)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--g7)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=file]{padding:8px}
textarea{min-height:90px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}.chk input{flex:none}
.err{color:var(--red);font-weight:600;min-height:1.2em;font-size:.88rem}
.hide{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* ===== الدخول ===== */
.hero{background:linear-gradient(170deg,#008a4c,#005c37);color:#fff;text-align:center;padding:12px 12px 16px;border-top:9px solid var(--fr);border-bottom:9px solid var(--fr);box-shadow:inset 0 2px 0 var(--fy),inset 0 -2px 0 var(--fy)}
.lsw{display:inline-flex;border:1.5px solid var(--fy);border-radius:8px;overflow:hidden;margin:0 auto 10px;direction:ltr}
.lsw button{background:transparent;color:#fff;border:0;padding:5px 16px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:'Cairo',sans-serif}
.lsw button.on{background:var(--fy);color:#2f2400;cursor:default}
.oh{display:flex;align-items:center;justify-content:space-between;gap:6px;text-align:start}
.oh>div{flex:1;min-width:0;font-size:.64rem;line-height:1.5;font-family:'Amiri','Cairo',serif;font-weight:700}
.oh .ar{text-align:right}.oh .fr{text-align:left;direction:ltr}
.oh b{display:block;font-size:.78rem}.oh i{display:block;font-style:normal;color:var(--fy)}.oh span{display:block;color:#e6f6ed;font-weight:600}
.oh img,.oh svg{flex:none}
.hero h1{font-size:1.02rem;font-weight:700;color:#fff;margin:12px 0 0;padding-top:8px;border-top:1px solid rgba(255,255,255,.28)}
.login{max-width:440px;margin:14px auto 0;padding:0 14px 20px}
.demo button{margin:3px 0}
.portals{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px}
.pch{border:0;padding:0;text-align:center;margin:0 0 10px}
.portal{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--g1);border:1.5px solid var(--g2);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.portal:hover,.portal:focus-visible{border-color:var(--g5);background:#fff;outline:0}
.portal:active{transform:scale(.99)}
.portal .pn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--g7);color:#fff;font-size:.8rem;font-weight:800;display:grid;place-items:center}
.portal .pi,.phead .pi{font-size:1.7rem;flex:none;line-height:1}
.portal .pt{flex:1;min-width:0}.portal .pt b{display:block;color:var(--g8);font-size:1.05rem}.portal .pt small{display:block;line-height:1.5}
.portal .pc{font-size:1.6rem;color:var(--g5);line-height:1}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.phead b{display:block;color:var(--g8)}
table.tt{table-layout:fixed;width:100%}table.tt td{font-size:.72rem;vertical-align:top;line-height:1.35;text-align:center;padding:5px 2px;word-break:break-word}table.tt th{white-space:nowrap;padding:5px 2px;font-size:.75rem}table.tt th:first-child{width:26px}table.tt td small{font-size:.66rem}
/* ===== ترويسة المستندات ===== */
.lh{text-align:center;padding:4px 0}
.lh b{display:block;color:var(--g8);font-size:.98rem;line-height:1.6;font-family:'Amiri','Cairo',serif}
.lh i{display:block;font-style:normal;color:var(--goldt);font-weight:700;font-size:.85rem;margin-bottom:2px}
.lh img,.lh svg{display:block;margin:4px auto}
.lh3{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px double var(--g8);padding-bottom:6px;margin-bottom:8px}
.lh3>div{flex:1;font-size:.72rem;line-height:1.5;color:var(--g8);font-weight:700;font-family:'Amiri','Cairo',serif}
.lho>div{flex:1}.lho .ar{text-align:right}.lho .fr{text-align:left;direction:ltr;font-family:'Cairo','Segoe UI',Arial,sans-serif}
.lho b{display:block;font-size:.8rem}.lho span{display:block}.lho img,.lho svg{margin:0 6px}
.lh3 i{display:block;font-style:normal;color:var(--goldt)}
.lh3 img,.lh3 svg{flex:none}
/* ===== القائمة ===== */
.ov{position:fixed;inset:0;background:rgba(8,30,20,.5);z-index:40;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{visibility:visible;opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:84%;max-width:320px;background:#fff;z-index:50;transform:translateX(105%);transition:transform .24s ease,visibility .24s;overflow:auto;box-shadow:-4px 0 18px rgba(0,0,0,.25);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer .dh{background:linear-gradient(180deg,#007a45,var(--g9));color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.drawer .dh small{color:#cde5d6;display:block}
.mi{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;text-align:right;font-weight:600;cursor:pointer;transition:background .15s}
.mi:active{background:var(--g1)}
.mi.on{background:var(--g1);color:var(--g8);border-right:4px solid var(--gold)}
@media(min-width:960px){
 .ib.menu,.ov,.drawer .dh .ib{display:none!important}
 .usr{display:flex}
 :root{--hh:84px}.bt em{display:block}.bt small{font-size:.74rem}.bt small i{display:inline;margin-inline-start:10px}.bt b{font-size:1.2rem}.oh>div{font-size:.8rem}.oh b{font-size:.95rem}
 .drawer{visibility:visible;transform:none;top:calc(var(--rh) + var(--hh) + 7px);width:250px;max-width:none;box-shadow:none;border-left:1px solid var(--line);z-index:20}
 main,.foot{margin-right:250px!important;max-width:none}
 main{padding:20px 28px 24px}
 main>*:not(.only-print){max-width:1000px}
 .grid{grid-template-columns:repeat(4,1fr)}
}
/* ===== المدرسة ===== */
.shead{margin-bottom:8px}
.shead h2{margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--g2);background:#fff;color:var(--g8);border-radius:20px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button.on{background:var(--g7);color:#fff;border-color:var(--g7);box-shadow:0 2px 6px rgba(0,122,69,.3)}
.sc{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:8px 0;background:#fcfdfc}
.sc b{display:block}
.arl{padding:9px 2px;border-bottom:1px solid var(--line)}.arl:last-child{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.arow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);transition:background .15s}
.arow.abs{background:var(--red1)}
.arow2{padding:4px 6px 8px;border-bottom:1px solid var(--line);background:var(--red1)}
.sabs{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.sabs.abs{background:var(--red1)}
.ci{border-right:4px solid var(--g5);padding:8px 12px;margin:8px 0;background:#fcfdfc;border-radius:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.ci.imp{border-right-color:var(--red0);background:#fffafa}
.ci p{margin:6px 0;white-space:pre-wrap}
.note{background:var(--gold1);border:1px solid #ecd48a;border-radius:8px;padding:8px 12px;font-size:.85rem;margin-bottom:10px}
.ro{background:var(--amb1);color:var(--amb);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700;margin-bottom:10px}
.gin{width:56px;min-height:36px;padding:4px 2px;text-align:center}
.seg{display:flex;gap:6px;margin:6px 0 10px}.seg .btn{flex:1}
.file{padding:10px 0;border-bottom:1px dashed var(--line)}
.file:last-child{border-bottom:0}
.file .fa{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
@media(min-width:640px){.file{display:flex;align-items:center;gap:10px}.file .fa{margin:0;flex:none}}
.empty{text-align:center;color:var(--mut);padding:18px 8px}
/* ===== نافذة منبثقة (ورقة سفلية على الهاتف) ===== */
#modal{position:fixed;inset:0;z-index:100;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .18s}
#modal.open{visibility:visible;opacity:1;pointer-events:auto}
.mbg{position:absolute;inset:0;background:rgba(8,30,20,.55)}
.mdlg{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 20px;box-shadow:0 -8px 40px rgba(0,0,0,.3);transform:translateY(36px);transition:transform .24s ease}
#modal.open .mdlg{transform:none}
@media(min-width:640px){.mdlg{bottom:auto;top:8vh;border-radius:14px}}
.macts{display:flex;gap:8px;margin-top:10px}.macts .btn{flex:1}
#toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:#1f2d25;color:#fff;border-radius:24px;padding:10px 18px;z-index:200;font-weight:600;visibility:hidden;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{visibility:visible;opacity:1}
/* ===== حركة انتقال ===== */
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.anim>*{animation:fin .24s ease both}
@media(prefers-reduced-motion:reduce){main.anim>*{animation:none}*{transition:none!important}}
/* ===== المستندات (التقرير والكشوف) ===== */
.paper{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:.92rem;box-shadow:var(--sh);margin-bottom:12px}

/* ---------- الشعار (رمز الهلال والنجمة — يُستبدل بالشعار الرسمي عبر EMBLEM_IMG) ---------- */
function emblem(sz){
  const im=(typeof EMBLEM_IMG!=='undefined')?EMBLEM_IMG:'';
  if(im)return `<img src="${esc(im)}" width="${sz}" height="${sz}" alt="الشعار الوطني" style="object-fit:contain">`;
  let st=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?3.6:9;st.push((50+r*Math.cos(a)).toFixed(1)+','+(26+r*Math.sin(a)).toFixed(1))}
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" role="img" aria-label="الشعار"><circle cx="50" cy="50" r="48" fill="#0b6b3a" stroke="#d6a82b" stroke-width="3"/><circle cx="50" cy="56" r="27" fill="#d6a82b"/><circle cx="50" cy="46" r="26" fill="#0b6b3a"/><polygon points="${st.join(' ')}" fill="#d6a82b"/></svg>`;
}

/* ---------- ملفات PDF (IndexedDB داخل المتصفح؛ في النسخة الفعلية تُخزَّن في Firebase Storage) ---------- */
const FILES={
  _db:null,_mem:{},
  open(){return new Promise(res=>{if(this._db)return res(this._db);try{const rq=indexedDB.open('insp_files',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('f');rq.onsuccess=()=>{this._db=rq.result;res(this._db)};rq.onerror=()=>res(null)}catch(e){res(null)}})},
  async put(id,blob){const db=await this.open();if(!db){this._mem[id]=blob;return false}
    return new Promise(r=>{try{const tx=db.transaction('f','readwrite');tx.objectStore('f').put(blob,id);tx.oncomplete=()=>r(true);tx.onerror=()=>{this._mem[id]=blob;r(false)}}catch(e){this._mem[id]=blob;r(false)}})},
  async get(id){if(this._mem[id])return this._mem[id];const db=await this.open();if(!db)return null;
    return new Promise(r=>{try{const q=db.transaction('f').objectStore('f').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})},
  async all(){const out=Object.assign({},this._mem),db=await this.open();if(!db)return out;
    return new Promise(r=>{try{const q=db.transaction('f').objectStore('f').openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else r(out)};q.onerror=()=>r(out)}catch(e){r(out)}})},
  async del(id){delete this._mem[id];const db=await this.open();if(!db)return;try{db.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
};

function inspForm(){
  const sch=orderedSchools();if(!sch.length){toast('أضف مدرسة أولاً');return}
  const first=(S.inf!=='all'&&school(S.inf))?S.inf:sch[0].id;
  openModal('⬆️ رفع تقرير تفتيش (PDF)',
    fld('المدرسة',sel('sid',sch.map(s=>[s.id,s.name]),first,'data-c="inspsch"'))+fld('يخص',`<div id="tgt">${sel('tg',targetOptions(first),'director')}</div>`)
    +fld('العنوان (اختياري)',inp('title','','placeholder="مثال: تقرير تفتيش الفصل الأول"'))+fld('التاريخ',`<input type="date" name="date" value="${today()}">`)
    +fld('ملف PDF','<input type="file" name="f" accept="application/pdf,.pdf" required>')+'<small>الحد الأقصى 10 ميغابايت. في النسخة التجريبية يُحفظ الملف داخل هذا المتصفح.</small>',
    async fd=>{
      const f=fd.get('f'),sid=fd.get('sid');
      if(!f||!f.size)return{err:'اختر ملف PDF'};
      if(!school(sid))return{err:'اختر المدرسة'};
      if(f.size>10*1024*1024)return{err:'حجم الملف أكبر من 10 ميغابايت'};
      let head='';try{head=await f.slice(0,5).text()}catch(e){}
      if(head.indexOf('%PDF')!==0)return{err:'الملف ليس PDF صالحًا'};
      const tg=String(fd.get('tg')||'director'),id=uid('in');
      const saved=await FILES.put(id,f);
      DB.inspections.push({id,sid,target:tg,title:String(fd.get('title')).trim()||f.name.replace(/\.pdf$/i,''),date:fd.get('date')||today(),by:U.name,fileName:f.name,size:f.size,seenBy:[]});
      save();toast(saved?'رُفع التقرير ✅':'رُفع مؤقتًا — تعذّر الحفظ الدائم في هذا المتصفح');
    },'⬆️ رفع');
}
async function openInsp(id,dl){
  const it=DB.inspections.find(x=>x.id===id);if(!it||!canView(it.sid))return;
  const b=await FILES.get(id);if(!b){toast('الملف غير متوفر على هذا الجهاز');return}
  const url=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));
  const a=document.createElement('a');a.href=url;if(dl)a.download=it.fileName||'تفتيش.pdf';else a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function metricsFor(s,p,range){
  const ss=DB.students.filter(x=>x.sid===s.id),vals=resOK(s.id,p)?ss.map(x=>avgFor(x.id,p)).concat(alumOf(s.id).map(a=>a[p])).filter(v=>v!=null):[];
  const from=range==='all'?'':daysAgo(parseInt(range,10)-1);
  const days=Object.keys(DB.attDone).filter(k=>k.endsWith('|'+s.id)).map(k=>k.split('|')[0]).filter(d=>d>=from),ds=new Set(days);

function markWords(v){
  v=Math.max(0,Math.min(20,Math.round(v*4)/4));const w=Math.floor(v),f=Math.round((v-w)*100)/100;
  const N=['صفر','واحدة','اثنتان','ثلاث','أربع','خمس','ست','سبع','ثماني','تسع','عشر','إحدى عشرة','اثنتا عشرة','ثلاث عشرة','أربع عشرة','خمس عشرة','ست عشرة','سبع عشرة','ثماني عشرة','تسع عشرة','عشرون'];
  const base=w===1?'نقطة':w===2?'نقطتان':N[w]+(w<=10?' نقاط':' نقطة');
  if(!f)return w===0?'صفر':w===1?'نقطة واحدة':base;
  const ft=f===.25?'ربع':f===.5?'نصف':'ثلاثة أرباع';
  return w===0?ft+' نقطة':base+' و'+ft;
}

/* ---------- رفع النسخة الموقّعة ---------- */
async function shrinkImg(f){
  if(!/^image\//.test(f.type)||f.size<1.5*1024*1024)return f;
  try{const bm=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
    c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));return b&&b.size<f.size?b:f}catch(e){return f}
}
function tSignForm(id){
  const r=DB.tinsp.find(x=>x.id===id);if(!r||!tOwn(r))return;
  openModal('⬆️ رفع النسخة الموقّعة',`<p>تقرير: <b>${esc(tName(r))}</b></p>`
    +fld('صورة أو ملف PDF للنسخة الموقّعة','<input type="file" name="f" accept="application/pdf,image/jpeg,image/png,.pdf,.jpg,.jpeg,.png" required>')
    +fld('تاريخ التوقيع',`<input type="date" name="d" value="${today()}">`)
    +'<small>الحد الأقصى 10 ميغابايت. بعد الرفع تتحول الحالة إلى «معتمد» ويظهر لمدير المدرسة؛ ولا يراه المعلم إلا بعد أن تتيح التفتيشات للمعلمين.</small>',
    async fd=>{
      let f=fd.get('f');if(!f||!f.size)return{err:'اختر صورة أو ملف PDF'};
      if(f.size>25*1024*1024)return{err:'الحجم كبير جدًا'};
      let hb=new Uint8Array(0);try{hb=new Uint8Array(await f.slice(0,8).arrayBuffer())}catch(e){}
      const pdf=hb[0]===0x25&&hb[1]===0x50&&hb[2]===0x44&&hb[3]===0x46,jpg=hb[0]===0xFF&&hb[1]===0xD8&&hb[2]===0xFF,png=hb[0]===0x89&&hb[1]===0x50&&hb[2]===0x4E&&hb[3]===0x47;
      if(!pdf&&!jpg&&!png)return{err:'الملف ليس صورة (JPG/PNG) ولا PDF صالحًا'};
      if(!pdf)f=await shrinkImg(f);
      if(f.size>10*1024*1024)return{err:'حجم الملف أكبر من 10 ميغابايت'};
      const mime=pdf?'application/pdf':(f.type==='image/jpeg'||jpg)?'image/jpeg':'image/png',ext=pdf?'pdf':mime==='image/png'?'png':'jpg';
      const saved=await FILES.put('ts_'+id,f);
      const was=r.status==='signed';r.signed={at:fd.get('d')||today(),fileName:'inspection-report-'+r.date+'.'+ext,size:f.size,mime};r.status='signed';if(!was)r.rel=null;r.seenBy=[];save();
      toast(saved?'اعتُمد التقرير ✅ (يُتاح للمعلم عند الإتاحة)':'اعتُمد مؤقتًا — تعذّر الحفظ الدائم في هذا المتصفح');
    },'⬆️ رفع واعتماد');
}
async function openTSigned(id,dl){
  const r=DB.tinsp.find(x=>x.id===id);if(!r||!canSeeT(r)||!tHasFile(r))return;
  const b=await FILES.get('ts_'+id);if(!b){toast('الملف غير متوفر على هذا الجهاز');return}
  const url=URL.createObjectURL(new Blob([b],{type:r.signed.mime||'application/pdf'}));
  const a=document.createElement('a');a.href=url;if(dl)a.download=r.signed.fileName||'تفتيش.pdf';else a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ---------- تغطية التفتيش + جدول الزيارات + ملف المعلم ---------- */
const yearStart=()=>String(DB.meta.year).split('-')[0]+'-09-01';
const yearEnd=()=>(parseInt(String(DB.meta.year).split('-')[0],10)+1)+'-08-31';
const CST={done:['فُتّش ✅','ok'],pending:['قيد الإنجاز','warn'],none:['لم يُفتَّش','red']};
const overdueVisits=()=>DB.visits.filter(v=>v.status==='planned'&&v.date<today()).length;
function tStat(t){
  const y0=yearStart(),y1=yearEnd(),all=DB.tinsp.filter(r=>r.tid===t.id);
  const signed=all.filter(r=>r.status==='signed').sort((a,b)=>a.date.localeCompare(b.date));
  const last=signed[signed.length-1]||null;
  const doneYear=signed.some(r=>r.date>=y0&&r.date<=y1),pend=all.some(r=>r.status!=='signed'&&r.date>=y0&&r.date<=y1);
  return{t,s:school(t.sid),n:signed.length,last,lastMark:last?tFinal(last):null,state:doneYear?'done':pend?'pending':'none',
    visit:DB.visits.filter(v=>v.tid===t.id&&v.status==='planned').sort((a,b)=>a.date.localeCompare(b.date))[0]||null};
}
function covData(){
  let sch=orderedSchools();
  if(S.cf==='direct')sch=sch.filter(s=>!s.communeId);else if(S.cf!=='all')sch=sch.filter(s=>s.communeId===S.cf);
  const ids=new Set(sch.map(s=>s.id)),rows=DB.teachers.filter(t=>ids.has(t.sid)).map(tStat);
  const perSchool=sch.map(s=>{const l=rows.filter(r=>r.t.sid===s.id);return{s,n:l.length,done:l.filter(r=>r.state==='done').length}});
  return{sch,ids,rows,perSchool};
}
const covCmp=(a,b)=>{const o={none:0,pending:1,done:2};
  if(o[a.state]!==o[b.state])return o[a.state]-o[b.state];
  const x=a.last?a.last.date:'',y=b.last?b.last.date:'';
  return x.localeCompare(y)||a.t.name.localeCompare(b.t.name,'ar')};

const CACT={
  ctab(el){S.ctab=el.dataset.t==='plan'?'plan':el.dataset.t==='cov'?'cov':'sch';render()},
  vsch(el){if(!isStaff())return;const s=school(el.dataset.id);if(!s)return;go('schvisit',{sid:s.id})},
  vback(){go('coverage',{ctab:'sch'})},
  vsdone(el){if(!isInsp())return;const v=DB.visits.find(x=>x.id===el.dataset.id);if(!v)return;v.status='done';save();render()},
  vins(el){if(!isInsp())return;const t=DB.teachers.find(x=>x.id===el.dataset.id);if(!t)return;
    let r=DB.tinsp.find(x=>x.tid===t.id&&x.status==='draft'&&tOwn(x));
    if(!r){r=tMakeDraft(t,today());const v=DB.visits.filter(x=>x.status==='planned'&&x.tid===t.id).sort((a,b)=>a.date.localeCompare(b.date))[0];if(v){v.status='done';v.rid=r.id}save()}
    go('tedit',{tr:r.id,tbk:'schvisit',sid:t.sid})},
  vnew(el){if(isInsp())visitForm(el.dataset.s,el.dataset.t)},
  vdone(el){if(!isInsp())return;const v=DB.visits.find(x=>x.id===el.dataset.id);if(!v)return;v.status='done';save();render()},
  vdel(el){if(!isInsp())return;const v=DB.visits.find(x=>x.id===el.dataset.id);if(!v)return;confirmBox('حذف هذه الزيارة من الجدول؟',()=>{DB.visits=DB.visits.filter(x=>x.id!==v.id);save()},'🗑️ حذف')},

    const r=tMakeDraft(t,today());v.status='done';v.rid=r.id;save();go('tedit',{tr:r.id})},
  tfile(el){const t=DB.teachers.find(x=>x.id===el.dataset.id);if(!t||!canView(t.sid))return;go('tfile',{tfid:t.id,tffrom:S.view==='tfile'?S.tffrom:S.view})},

const CIRC_FOOT='مفتشية التعليم بمقاطعة كنكوصة';

const CRS={read:['اطّلع ✅','ok'],unread:['لم يطّلع ⏳','warn'],noacc:['بلا حساب ⚪','']};
function circRecv(c){

function doDeliver(sid,rows,o){

function voidDeliv(d,why){

  d.void=true;d.voidAt=Date.now();d.voidBy=U.name;d.voidWhy=why||'';
  const nd=d.needId?DB.needs.find(x=>x.id===d.needId):null;

/* =====================  السنة الدراسية: الانتقال والأرشيف  ===================== */
const nextYear=y=>{const a=parseInt(String(y).split('-')[0],10);return(a+1)+'-'+(a+2)};
const FATE={up:['رُفِّع','ok'],rep:['يعيد السنة','warn'],nog:['بلا معدل — بقي في قسمه','warn'],grad:['أنهى المرحلة','ok'],exit:['غادر (أعلى مستوى في مدرسته)',''],pend:['بلا نتيجة مسابقة — بقي في قسمه','warn']};
const PRE=()=>KEY+'_pre';
const clsLevel=c=>{if(c.level>=1&&c.level<=6)return c.level;const i=LEVELS.findIndex(l=>String(c.name||'').indexOf(l)===0);return i+1};

/* ---- خطة الانتقال (لا تغيّر شيئًا) ---- */
function rollPlan(){
  return orderedSchools().map(sc=>{
    const cls=DB.classes.filter(c=>c.sid===sc.id),sts=DB.students.filter(s=>s.sid===sc.id),fates={};
    const cn=n=>(cls.find(c=>c.id===n)||{}).name||'—';
    sts.forEach(s=>{
      const c=cls.find(x=>x.id===s.cid),lv=c?clsLevel(c):0,a=annual(s.id);let f;
      if(!c||!lv)f='nog';
      else if(lv>=6)f=cxRes(s.id)?'rep':'pend'; /* السادسة: المصير بنتيجة المسابقة لا بالمعدل؛ الناجح أُرشف عند صدور نتيجته */
      else if(a==null)f='nog';
      else if(a<10)f='rep';
      else if(!cls.some(x=>clsLevel(x)===lv+1))f='exit';
      else f='up';
      fates[s.id]={f,lv,from:s.cid,fromName:c?c.name:'—',to:s.cid,avg:a};
    });
    const load={};cls.forEach(c=>{load[c.id]=0});
    sts.forEach(s=>{const x=fates[s.id];if(x.f==='rep'||x.f==='nog'||x.f==='pend')load[x.from]=(load[x.from]||0)+1});
    sts.filter(s=>fates[s.id].f==='up').sort((a,b)=>a.name.localeCompare(b.name,'ar')).forEach(s=>{
      const x=fates[s.id],cand=cls.filter(c=>clsLevel(c)===x.lv+1).sort((p,q)=>(load[p.id]-load[q.id])||p.name.localeCompare(q.name,'ar'))[0];
      x.to=cand.id;x.toName=cand.name;load[cand.id]++;
    });
    const cnt={up:0,rep:0,nog:0,grad:0,exit:0,pend:0};sts.forEach(s=>{cnt[fates[s.id].f]++});
    return{sid:sc.id,name:sc.name,total:sts.length,nog:cnt.nog,cnt,fates,pubY:pubOn(sc.id,'y'),sent:DB.reports.some(r=>r.sid===sc.id&&r.year===DB.meta.year),cn};
  });
}

function applyRollover(){
  const old=DB.meta.year,ny=nextYear(old),P=rollPlan(),at=Date.now();
  const snap=JSON.stringify(DB);store.set(PRE(),snap);
  if(store.get(PRE())!==snap)return{err:'تعذّر حفظ نسخة احتياطية قبل الانتقال (مساحة المتصفح ممتلئة). صدِّر نسخة احتياطية إلى ملف ثم أعد المحاولة.'};
  const sAbsBy={};DB.sAbs.forEach(a=>{sAbsBy[a.stid]=(sAbsBy[a.stid]||0)+1});
  /* 1) أرشفة كل مدرسة قبل أي تعديل */
  const recs=P.map(p=>{
    const sc=school(p.sid),sts=DB.students.filter(s=>s.sid===p.sid);
    const stu0=sts.map(s=>{const x=p.fates[s.id],m=DB.marks[s.id];
      return{id:s.id,name:s.name,sex:s.sex,no:s.no,nat:s.nat||'',cname:x.fromName,level:x.lv,e1:examAvg(s.id,'e1'),e2:examAvg(s.id,'e2'),e3:examAvg(s.id,'e3'),y:x.avg,f:x.f,toName:x.f==='up'?x.toName:(x.f==='rep'||x.f==='nog'||x.f==='pend')?x.fromName:'',ab:sAbsBy[s.id]||0,m:m||null}});
    const alu=alumOf(p.sid),cs=cxStat(p.sid); /* خريجو العام (ناجحو المسابقة) يدخلون سجل السنة */
    const stu=stu0.concat(alu.map(a=>({id:a.id,name:a.name,sex:a.sex,no:a.no,nat:a.nat||'',cname:a.cname,level:6,e1:a.e1,e2:a.e2,e3:a.e3,y:a.y,f:'grad',toName:a.to||'',ab:a.ab||0,m:a.m||null})));
    const graded=stu.filter(x=>x.y!=null),pass=graded.filter(x=>x.y>=10).length;
    return{id:uid('ar'),year:old,sid:p.sid,sname:sc.name,spar:parentName(sc),at,by:U.name,pubY:p.pubY,rep:buildReport(p.sid,true),stu,
      tab:DB.teachers.filter(t=>t.sid===p.sid).map(t=>({name:t.name,days:DB.tAbs.filter(a=>a.tid===t.id).length})).filter(x=>x.days),
      st:{n:stu.length,boys:stu.filter(x=>x.sex==='M').length,girls:stu.filter(x=>x.sex==='F').length,graded:graded.length,pass,up:p.cnt.up,rep:p.cnt.rep,nog:p.cnt.nog,grad:alu.length,exit:p.cnt.exit,pend:p.cnt.pend,cx:{pass:cs.pass,fail:cs.fail,abs:cs.abs,pend:cs.pend}}};
  });
  recs.forEach(r=>DB.arch.push(r));
  /* 2) نقل التلاميذ */
  const gone=new Set();
  P.forEach(p=>DB.students.forEach(s=>{if(s.sid!==p.sid)return;const x=p.fates[s.id];if(!x)return;if(x.f==='up')s.cid=x.to;else if(x.f==='grad'||x.f==='exit')gone.add(s.id)}));
  DB.students=DB.students.filter(s=>!gone.has(s.id));
  /* 3) تصفير بيانات العام المنتهي */
  DB.alumni.filter(a=>a.yr===old).forEach(a=>{a.lock=true;a.m=null;a.abr=null;a.st=null}); /* سجلهم صار في أرشيف السنة */
  DB.cx={};
  DB.marks={};DB.sAbs=[];DB.tAbs=[];DB.attDone={};DB.pub={};DB.notes={};DB.asub={};DB.msub={};
  DB.meta.year=ny;
  DB.visits=DB.visits.filter(v=>!(v.status==='planned'&&v.date<yearStart()));
  DB.meta.rolled={from:old,to:ny,at,by:U.name,schools:recs.length,students:recs.reduce((a,r)=>a+r.st.n,0)};
  save();return null;
}

/* ---- إحصاء مدرسة ---- */
function cxStat(sid){
  const ss=sixthSts(sid),pass=alumOf(sid).length;let fail=0,abs=0,pend=0;
  ss.forEach(s=>{const r=cxRes(s.id);if(r==='fail')fail++;else if(r==='abs')abs++;else pend++});
  const total=pass+fail+abs+pend,cands=total-abs;
  return{sid,pass,fail,abs,pend,total,cands,rate:cands?pass*100/cands:null};
}
function cxSum(ids){
  const t={schools:0,pass:0,fail:0,abs:0,pend:0,total:0,cands:0};
  ids.forEach(id=>{if(!hasSixth(id))return;const x=cxStat(id);t.schools++;['pass','fail','abs','pend','total','cands'].forEach(k=>{t[k]+=x[k]})});
  t.rate=t.cands?t.pass*100/t.cands:null;return t;
}

  DB.alumni=DB.alumni.filter(x=>x.id!==s.id);
  const a={id:s.id,sid:s.sid,sname:sc?sc.name:'',name:s.name,sex:s.sex,no:s.no||'',nat:s.nat||'',cid:s.cid,cname:c?c.name:'',yr:DB.meta.year,
    exNo:o.no||'',to:o.to||'',via:o.via||'dir',b:o.b||'',at:Date.now(),by:U.name,
    e1:examAvg(s.id,'e1'),e2:examAvg(s.id,'e2'),e3:examAvg(s.id,'e3'),y:annual(s.id),m:DB.marks[s.id]||null,abr,ab:abr.length,st:Object.assign({},s),lock:false};
  DB.alumni.push(a);
  DB.students=DB.students.filter(x=>x.id!==s.id);delete DB.marks[s.id];DB.sAbs=DB.sAbs.filter(x=>x.stid!==s.id);delete DB.cx[s.id];
  return a;

function cxRestore(id){
  const a=DB.alumni.find(x=>x.id===id);
  if(!a||a.lock||a.yr!==DB.meta.year||!a.st)return'لا يمكن إرجاع هذا التلميذ (أُغلقت سنته)';
  if(!school(a.sid))return'المدرسة غير موجودة';
  const cls=DB.classes.filter(c=>c.sid===a.sid),cid=cls.some(c=>c.id===a.cid)?a.cid:(cls.find(c=>clsLevel(c)===6)||{}).id;
  if(!cid)return'لا يوجد قسم للسنة السادسة في هذه المدرسة';

  if(a.m)DB.marks[id]=a.m;
  (a.abr||[]).forEach(x=>DB.sAbs.push(Object.assign({},x,{cid})));
  DB.alumni=DB.alumni.filter(x=>x.id!==id);delete DB.cx[id];
  return null;

const AD='٠١٢٣٤٥٦٧٨٩',PD='۰۱۲۳۴۵۶۷۸۹';
const dig=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>AD.indexOf(d)).replace(/[۰-۹]/g,d=>PD.indexOf(d));
function nTok(s,kd){
  const t=dig(s).replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ک/g,'ك').replace(/[یێ]/g,'ي').replace(/ہ/g,'ه')
    .replace(kd?/[^\u0621-\u064A0-9\s]/g:/[^\u0621-\u064A\s]/g,' ');
  return t.split(/\s+/).filter(Boolean).map(x=>x==='منت'||x==='ابنت'?'بنت':x);
}
function lev(a,b){
  if(a===b)return 0;if(Math.abs(a.length-b.length)>3)return 9;
  let p=[];for(let j=0;j<=b.length;j++)p[j]=j;
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[b.length];
}
function cxParse(txt){
  const out=[];
  String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(raw=>{
    const t=dig(raw).replace(/^\s*\d{1,3}\s*[-.)\u066B\u06D4:]+\s*/,'');
    let no='';const txts=[];
    t.split(/[\t،,;|]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>{
      const q=p.replace(/\s/g,'');
      if(/^\d{3,}$/.test(q)){if(!no)no=q;return}
      let m=p.match(/^(\d{4,})\s+(.+)$/);if(m){if(!no)no=m[1];txts.push(m[2]);return}
      m=p.match(/^(.+?)\s+(\d{4,})$/);if(m){if(!no)no=m[2];txts.push(m[1]);return}
      txts.push(p);
    });
    const toks=nTok(txts[0]||'');
    if(toks.length)out.push({i:out.length+1,raw,name:txts[0],hint:txts[1]||'',no,toks,j:toks.join('')});
  });
  return out;
}
const sch2=sc=>nTok(shortName(sc.name),true).join('');
function cxMatch(rows){
  const pool=[];
  DB.classes.forEach(c=>{if(clsLevel(c)!==6)return;DB.students.filter(s=>s.cid===c.id).forEach(s=>{const t=nTok(s.name);pool.push({s,t,j:t.join(''),sc:school(s.sid),cn:c.name})})});
  const used=new Set(),res=[];
  const info=p=>({id:p.s.id,name:p.s.name,sname:p.sc?shortName(p.sc.name):'—',cname:p.cn});
  rows.forEach(r=>{
    let P=pool.filter(p=>!used.has(p.s.id));
    const hn=nTok(r.hint,true).filter(x=>x!=='مدرسه'&&x!=='الابتدائيه').join('');
    if(hn){const f=P.filter(p=>p.sc&&(sch2(p.sc).indexOf(hn)>-1||hn.indexOf(sch2(p.sc))>-1&&sch2(p.sc)));if(f.length)P=f}
    const o={row:r,k:'none',c:[]};
    let E=[];
    if(r.no)E=P.filter(p=>(p.s.nat&&p.s.nat===r.no)||(DB.cx[p.s.id]&&DB.cx[p.s.id].no===r.no));
    if(E.length===1){o.k='ok';o.c=[Object.assign(info(E[0]),{why:'رقم الترشح / الرقم الوطني'})];used.add(E[0].s.id);res.push(o);return}
    E=P.filter(p=>p.j===r.j);
    if(E.length===1){o.k='ok';o.c=[Object.assign(info(E[0]),{why:'الاسم مطابق'})];used.add(E[0].s.id);res.push(o);return}
    if(E.length>1){o.k='rev';o.c=E.map(p=>Object.assign(info(p),{why:'اسم مكرّر — اختر التلميذ الصحيح'}));res.push(o);return}
    const near=[];
    P.forEach(p=>{
      const a=r.toks.slice().sort().join(' '),b=p.t.slice().sort().join(' ');
      let w=0,why='';
      if(a===b){w=3;why='الاسم نفسه بترتيب مختلف'}
      else{
        const sh=Math.min(r.toks.length,p.t.length);
        if(sh>=2&&r.toks.slice(0,sh).join(' ')===p.t.slice(0,sh).join(' ')&&Math.abs(r.toks.length-p.t.length)<=2){w=2;why='اسم ناقص أو زائد جزءًا'}
        else{const d=lev(r.j,p.j),L=Math.min(r.j.length,p.j.length);if(d>0&&d<=(L>=14?2:L>=8?1:0)){w=1;why='فرق بسيط في الإملاء'}}
      }
      if(w)near.push({p,w,why});
    });
    near.sort((x,y)=>y.w-x.w);
    if(near.length){o.k='rev';o.c=near.slice(0,3).map(x=>Object.assign(info(x.p),{why:x.why}))}
    res.push(o);
  });
  return res;
}

    else if(i===4&&t.length>=3)lines.push([t[2]].concat(t.slice(0,2),t.slice(3)).join(' '));
    else if(i===5)lines.push(s.name.replace(/[أإ]/g,'ا').replace('ـ','')+'، '+(100100+i));
    else lines.push(s.name+(i%2?'':'، '+(100100+i)));
  });
  lines.push('عمر ولد غير موجود في المنصة');
  return lines.join('\n');
}

/* =====================  السلسلة: المعلم ← المدير ← المفتشية  +  جدول الحصص  ===================== */
/* الغياب: معلم القسم يأخذ غياب تلاميذه ويُصدره للمدير، والمدير يعتمد اليوم فيصل إلى المفتشية.
   العلامات: معلم القسم يُدخل علامات كل امتحان ويُصدرها للمدير، والمدير يُظهرها للمفتشية. */
const clsTeachers=cid=>DB.teachers.filter(t=>t.cids.indexOf(cid)>-1);
const clsAcc=cid=>clsTeachers(cid).some(t=>DB.accounts.some(a=>a.role==='teacher'&&a.tid===t.id)); /* هل لمعلم القسم حساب؟ */
const asubOf=(d,cid)=>DB.asub[d+'|'+cid]||null;   /* إصدار الغياب إلى المدير */
const msubOf=(cid,k)=>DB.msub[cid+'|'+k]||null;   /* إصدار علامات امتحان إلى المدير */
const dayDone=(d,sid)=>!!DB.attDone[d+'|'+sid];    /* اعتمده المدير */
const chConfirm=(msg,fn,ok)=>openModal('تأكيد',`<p>${msg}</p>`,()=>{fn();return{noaudit:true}},ok||'نعم، تأكيد');
const classesWithTeacher=sid=>DB.classes.filter(c=>c.sid===sid&&clsAcc(c.id)&&DB.students.some(s=>s.cid===c.id));

/* من يحق له تعديل غياب تلاميذ هذا القسم في هذا اليوم؟ */
function canAbs(cid,d){
  const c=DB.classes.find(x=>x.id===cid);if(!c||!U||!d||d>today())return false;
  if(dayDone(d,c.sid))return false;                       /* اعتمد المدير اليوم: مُقفل */
  if(U.role==='teacher')return ownsCls(cid)&&!asubOf(d,cid);
  if(U.role==='director'&&U.sid===c.sid)return !clsAcc(cid); /* بلا حساب معلم: المدير يدخل غياب القسم بنفسه */
  return false;
}

/* ---- ترحيل بيانات قديمة: ما اعتُمد أو أُظهر سابقًا يُعتبر مُصدَرًا ---- */
function chainBackfill(){
  DB.asub=DB.asub||{};DB.msub=DB.msub||{};DB.tt=DB.tt||{};
  Object.keys(DB.attDone).forEach(key=>{const i=key.indexOf('|'),d=key.slice(0,i),sid=key.slice(i+1);
    DB.classes.filter(c=>c.sid===sid&&clsAcc(c.id)).forEach(c=>{const k=d+'|'+c.id;if(!DB.asub[k])DB.asub[k]={at:Date.parse(d+'T10:00:00')||Date.now(),by:'—'}})});
  Object.keys(DB.pub).forEach(sid=>{const o=DB.pub[sid]||{};Object.keys(o).forEach(p=>{
    (p==='y'?['e1','e2','e3']:[p]).forEach(k=>{DB.classes.filter(c=>c.sid===sid&&clsAcc(c.id)).forEach(c=>{const x=c.id+'|'+k;if(!DB.msub[x])DB.msub[x]={at:o[p]||Date.now(),by:'—'}})})})});
  if(!Object.keys(DB.tt).length)DB.schools.forEach(s=>ttSeed(s.id));
  DB.chain=1;
}
function chainDelCls(cid){
  Object.keys(DB.asub).forEach(k=>{if(k.endsWith('|'+cid))delete DB.asub[k]});
  Object.keys(DB.msub).forEach(k=>{if(k.indexOf(cid+'|')===0)delete DB.msub[k]});
  Object.keys(DB.tt).forEach(s=>{const c=DB.tt[s].cells;Object.keys(c).forEach(k=>{if(k.indexOf(cid+'|')===0)delete c[k]})});
}

/* ===================== جدول الحصص ===================== */
const DAYN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DORD=[1,2,3,4,5,6,0]; /* ترتيب العرض: من الاثنين */
const subN=id=>(SUBJECTS.find(x=>x.id===id)||{n:'—'}).n;
const ttOf=sid=>DB.tt[sid]||{days:[1,2,3,4,5],per:5,cells:{}};
const ttEns=sid=>DB.tt[sid]=DB.tt[sid]||{days:[1,2,3,4,5],per:5,cells:{}};
const ttDays=sid=>DORD.filter(d=>ttOf(sid).days.indexOf(d)>-1);
/* معلم الحصة: معلم الفرنسية لمادة الفرنسية، وإلا معلم العربية، وإلا أي معلم للقسم */
function ttTeacher(cid,sub){
  const ts=clsTeachers(cid);if(!ts.length)return null;
  const want=sub==='fr'?['fr','both']:['ar','both'];
  for(const w of want){const t=ts.find(x=>x.type===w);if(t)return t}
  return ts[0];
}
function ttSetCell(sid,cid,d,p,sub){ /* ترجع نص الخطأ أو null */
  const t=ttEns(sid),key=cid+'|'+d+'|'+p;
  if(!sub){delete t.cells[key];return null}
  if(!SUBJECTS.some(x=>x.id===sub))return'مادة غير معروفة';
  const tc=ttTeacher(cid,sub);
  if(tc)for(const k of Object.keys(t.cells)){const a=k.split('|');if(a[0]!==cid&&+a[1]===d&&+a[2]===p){const o=ttTeacher(a[0],t.cells[k]);if(o&&o.id===tc.id){const cn=DB.classes.find(x=>x.id===a[0]);return 'المعلم «'+tc.name+'» لديه حصة في هذا الوقت مع '+(cn?cn.name:'قسم آخر')}}}
  t.cells[key]=sub;return null;
}
function ttSeed(sid){
  const cls=sortCls(DB.classes.filter(c=>c.sid===sid));if(!cls.length)return;
  const t=DB.tt[sid]={days:[1,2,3,4,5],per:5,cells:{}};
  const pat=[['qr','ar','ma','fr','is'],['ar','ma','fr','sc','hg'],['is','ar','ma','fr','cv'],['ar','qr','ma','sc','fr'],['ma','ar','hg','is','ar']];
  cls.forEach((c,ci)=>t.days.forEach((d,di)=>{for(let p=0;p<5;p++)ttSetCell(sid,c.id,d,p,pat[di][(p+ci)%5])}));
}
/* حصص معلم: [{d,p,sub,cid}] */
function lessonsOf(tid){
  const t=DB.teachers.find(x=>x.id===tid);if(!t)return[];const T=ttOf(t.sid),o=[];
  Object.keys(T.cells).forEach(k=>{const a=k.split('|'),tc=ttTeacher(a[0],T.cells[k]);if(tc&&tc.id===tid&&+a[2]<T.per&&T.days.indexOf(+a[1])>-1)o.push({cid:a[0],d:+a[1],p:+a[2],sub:T.cells[k]})});
  return o;
}
function ttGrid(sid,cellFn){
  const T=ttOf(sid),days=ttDays(sid);
  return `<div class="tw"><table class="kt tt"><thead><tr><th>#</th>${days.map(d=>`<th>${DAYN[d]}</th>`).join('')}</tr></thead><tbody>${
    Array.from({length:T.per},(_,p)=>`<tr><th>${p+1}</th>${days.map(d=>`<td>${cellFn(d,p)||'<span class="mut">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const clsShort=c=>c?c.name:'';
function ttClassPaper(sid,cid){
  const sc=school(sid),c=DB.classes.find(x=>x.id===cid),T=ttOf(sid),multi=clsTeachers(cid).length>1;
  const g=ttGrid(sid,(d,p)=>{const s=T.cells[cid+'|'+d+'|'+p];if(!s)return'';const t=ttTeacher(cid,s);return `<b>${esc(subN(s))}</b>${t&&multi?`<br><small>${esc(t.name)}</small>`:''}`});

/* =====================  الطلبات: المعلم ← المدير ← المفتشية  =====================
   المعلم يكتب طلبه ويُصدره إلى المدير بضغطة زر؛ والمدير يُصدره إلى المفتشية بضغطة زر؛ وترد المفتشية فيصل الردّ إلى المدير والمعلم.
   المسودة والطلب المُعاد لا يراهما إلا صاحبهما؛ وما عند المدير لا يراه المفتش حتى يُصدره المدير. */
const RQT=[['leave','🏖️ إجازة أو رخصة'],['cert','📄 شهادة إدارية'],['move','🔁 نقل أو تغيير قسم'],['need','📦 احتياج تعليمي'],['train','🎓 تكوين أو تدريب'],['comp','💬 شكوى أو اقتراح'],['o','📌 أخرى']];
const RQS={draft:['✍️ مسودة',''],dir:['📤 عند المدير','warn'],ret:['↩️ أعاده المدير','red'],insp:['🏛️ عند المفتشية','warn'],prog:['🔄 قيد الدراسة',''],ok:['✅ تمت الموافقة','ok'],no:['❌ مرفوض','red']};
const RQ_INSP=['insp','prog','ok','no']; /* حالات الطلب بعد وصوله إلى المفتشية */
const rqType=k=>(RQT.find(x=>x[0]===k)||RQT[RQT.length-1])[1];
Object.assign(LOGMAP,{rqiss:'إصدار طلب إلى المدير',rqpull:'سحب طلب من المدير',rqfwd:'إصدار طلب معلم إلى المفتشية',rqundo:'سحب طلب من المفتشية'});

/* من يرى ماذا */
function rqVis(r){
  if(!U||!r)return false;
  if(U.role==='teacher')return r.tid===U.tid;
  if(U.role==='director')return r.sid===U.sid&&r.st!=='draft';
  if(isStaff())return RQ_INSP.indexOf(r.st)>-1;
  return false;
}
const rqList=()=>(DB.reqs||[]).filter(rqVis);
const rqGet=el=>(DB.reqs||[]).find(r=>r.id===(el&&el.dataset&&el.dataset.id))||null;
const rqMine=r=>!!r&&!!U&&U.role==='teacher'&&r.tid===U.tid;
const rqMyDir=r=>!!r&&!!U&&U.role==='director'&&r.sid===U.sid;
function rqBadge(){
  if(!U||!DB.reqs)return 0;const L=rqList();
  if(U.role==='teacher')return L.filter(r=>r.tSeen===false).length;
  if(U.role==='director')return L.filter(r=>r.st==='dir'||(r.dSeen===false&&RQ_INSP.indexOf(r.st)>-1)).length;
  return isInsp()?L.filter(r=>r.st==='insp'&&!r.seenAt).length:0;
}
function rqIssue(r){r.st='dir';r.issAt=Date.now();r.dirAt=null;r.dirBy='';r.retNote='';r.retAt=null;r.dSeen=false;r.tSeen=true}

/* ---- البطاقة ---- */
function rqCard(r,fresh){
  const T=U.role==='teacher',D=U.role==='director',st=RQS[r.st]||RQS.draft,sc=school(r.sid)||{name:'مدرسة محذوفة'};
  const ln=(ic,t,w)=>`${ic} ${t}${w?` <bdi>${fmtDT(w)}</bdi>`:''}`;
  const tl=[ln('✍️','كتبه <span data-nt>'+esc(r.by||'')+'</span>',r.at)];
  if(r.issAt)tl.push(ln('📤','أصدره المعلم إلى المدير',r.issAt));
  if(r.st==='ret'&&r.retAt)tl.push(ln('↩️','أعاده المدير إلى المعلم',r.retAt));
  if(r.dirAt)tl.push(ln('📤','أصدره المدير إلى المفتشية',r.dirAt));
  if(r.seenAt)tl.push(ln('👁️','اطلع المفتش على الطلب',r.seenAt));
  if(r.repAt)tl.push(ln('↩️','رد المفتشية',r.repAt));
  let acts='';
  if(T&&rqMine(r)){
    if(r.st==='draft'||r.st==='ret')acts=`<button class="btn sm gold" data-a="rqiss" data-id="${r.id}">📤 إصدار للمدير</button><button class="btn sm sec" data-a="rqedit" data-id="${r.id}">✏️ تعديل</button><button class="btn sm dan" data-a="rqdel" data-id="${r.id}">🗑️ حذف</button>`;
    else if(r.st==='dir')acts=`<button class="btn sm sec" data-a="rqpull" data-id="${r.id}">↩️ سحب للتعديل</button>`;
  }else if(D&&rqMyDir(r)){
    if(r.st==='dir')acts=`<button class="btn sm gold" data-a="rqfwd" data-id="${r.id}">📤 إصدار للمفتشية</button><button class="btn sm sec" data-a="rqret" data-id="${r.id}">↩️ إعادة للمعلم</button>`;
    else if(r.st==='insp'&&!r.seenAt)acts=`<button class="btn sm sec" data-a="rqundo" data-id="${r.id}">↩️ سحب الإصدار</button>`;
  }else if(isInsp()){
    acts=`<button class="btn sm pri" data-a="rqrep" data-id="${r.id}">↩️ رد على الطلب</button>`;
  }
  return `<div class="sc rq"><div class="row"><b>${fresh?'<span class="chip new">جديد</span> ':''}<span data-nt>${esc(r.title)}</span></b><span class="chip ${st[1]}">${st[0]}</span></div>
  <div><span class="chip">${rqType(r.type)}</span>${T?'':`<span class="chip">👨‍🏫 <span data-nt>${esc(r.by||'')}</span></span>`}${isStaff()?`<span class="chip">🏫 ${esc(sc.name)}</span>`:''}</div>
  <p data-nt style="white-space:pre-wrap;margin:4px 0">${esc(r.text)}</p>
  <small class="rqtl">${tl.join('<br>')}</small>
  ${r.st==='ret'&&r.retNote?`<div class="note" style="margin:8px 0 0">↩️ <b>ملاحظة المدير</b><br><span data-nt>${esc(r.retNote)}</span></div>`:''}
  ${r.rep?`<div class="note" style="margin:8px 0 0">↩️ <b>رد المفتشية</b> (<span data-nt>${esc(r.repBy||'')}</span>)<br><span data-nt>${esc(r.rep)}</span></div>`:''}
  ${acts?`<div class="acts noprint">${acts}</div>`:''}</div>`;
}

/* ---- الشاشة (واحدة للمعلم والمدير والمفتشية، تختلف بحسب الدور) ---- */
function reqsView(){
  const T=U.role==='teacher',D=U.role==='director',I=isStaff();
  const all=rqList();let L=all.slice();
  if(I){if(S.rqs!=='all')L=L.filter(r=>r.sid===S.rqs);if(S.rqf!=='all')L=L.filter(r=>r.st===S.rqf)}
  const pend=r=>(T?(r.st==='ret'||r.st==='draft'):D?r.st==='dir':r.st==='insp')?1:0;
  L=L.slice().sort((a,b)=>(pend(b)-pend(a))||(b.at-a.at));
  const isNew=r=>T?r.tSeen===false:D?(r.dSeen===false):(r.st==='insp'&&!r.seenAt);
  const fresh=new Set(L.filter(isNew).map(r=>r.id)),cnt=k=>all.filter(r=>r.st===k).length;
  const ttl=T?'📨 طلباتي':D?'📨 طلبات المعلمين':'📨 الطلبات الواردة';
  const sub=T?'اكتب طلبك وأصدره للمدير بضغطة زر؛ يصدره المدير إلى المفتشية وتصلك الردود هنا.':D?'ما يصدره معلمو مدرستك إليك؛ أصدره إلى المفتشية بضغطة زر أو أعده إلى المعلم بملاحظة.':'ما أصدره مديرو المدارس من طلبات المعلمين؛ اطلع عليها ورد عليها.';

  ${I?`<div class="two" style="margin-top:8px">${fld('المدرسة',sel('s',[['all','كل المدارس']].concat(orderedSchools().map(s=>[s.id,s.name])),S.rqs,'data-c="rqs"'))}${fld('الحالة',sel('f',[['all','الكل']].concat(RQ_INSP.map(k=>[k,RQS[k][0]])),S.rqf,'data-c="rqf"'))}</div>`:''}</div>
  ${L.map(r=>rqCard(r,fresh.has(r.id))).join('')||`<div class="card empty">${T?'لا توجد طلبات بعد. اضغط «طلب جديد» لتكتب طلبك وتصدره للمدير.':'لا توجد طلبات'}</div>`}`;
  /* ما رُئي الآن لا يعود «جديدًا» */
  let ch=false;

    if(T)r.tSeen=true;else if(D)r.dSeen=true;else if(isInsp()){r.seenAt=Date.now();r.seenBy=U.name}else return;ch=true});
  if(ch)save();
  return html;
}

      if(go)rqIssue(q);

/* ============ زر «حفظ» للتعديلات المباشرة ============
   كل تعديل مباشر (علامة، تقييم مؤشر، ملاحظة، غياب، مرافق…) يبقى في الذاكرة معلّقًا ويظهر شريط ثابت:
   «💾 حفظ» لتثبيته، «↩️ تراجع» لإلغائه. وحتى لا يضيع شيء يُثبَّت تلقائيًا عند أي إجراء آخر (تنقّل، إصدار…)
   أو عند مغادرة الصفحة/إخفائها. أما النوافذ المنبثقة ففيها زر حفظ خاص بها. */
const INLACT=new Set(['tsc','taxfull','tpull']);          // إجراءات نقر تعدّل البيانات مباشرة (تقييم مؤشرات التفتيش)
const SVEX=new Set(['svsave','svdiscard','mclose']);      // لا تُثبّت المعلّق قبل تنفيذها

function commitPending(){
  if(!DEFER)return false;
  STAGE=false;DEFER=false;store.set(KEY,JSON.stringify(DB));svbar();return true;
}
function discardPending(){
  const id=U&&U.id;STAGE=false;DEFER=false;load();U=id?(DB.accounts.find(a=>a.id===id)||null):null;svbar();
}
function svbar(){
  let b=document.getElementById('svb');
  if(!b){
    if(!document.body)return;
    b=document.createElement('div');b.id='svb';b.className='svb noprint';b.setAttribute('role','status');
    b.innerHTML='<span class="svt">✏️ تعديلات غير محفوظة</span><button type="button" class="btn sm sec" data-a="svdiscard">↩️ تراجع</button><button type="button" class="btn sm gold" data-a="svsave">💾 حفظ</button>';
    document.body.appendChild(b);
  }
  const on=!!(DEFER&&U);b.classList.toggle('on',on);document.body.classList.toggle('svon',on);
}
const SVACT={
  svsave(){commitPending();toast('تم الحفظ ✅')},
  svdiscard(){if(!DEFER)return;confirmBox('سيُتراجع عن كل التعديلات التي لم تُحفظ بعد. متابعة؟',()=>{discardPending()},'↩️ تراجع')}
};

/* التعديلات التي تأتي من حقول الإدخال (change/input) تُعلَّق ولا تُكتب في التخزين فورًا */
['change','input'].forEach(ev=>{
  window.addEventListener(ev,e=>{const t=e.target;if(t&&t.closest&&!t.closest('#modal')&&!t.closest('#lf'))STAGE=true},true);

/* ============ المفتشية: التسلسل الهرمي — المقاطعة ← البلدية ← المدرسة ← ملف المدرسة ============
   ثلاث قوائم اختيار على شكل أزرار (كقائمة الامتحانات) في كل منها خانة بحث:
   اختيار المقاطعة يُظهر زر البلدية، واختيار البلدية يُظهر زر المدرسة، واختيار المدرسة يفتح ملفها كاملًا.
   لا تُعرض أي قائمة في الصفحة نفسها؛ الخيارات تظهر داخل القائمة المنسدلة فقط. */

const arN=s=>String(s==null?'':s).replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').toLowerCase().replace(/\s+/g,' ').trim();
const hitN=(q,...f)=>{const n=arN(q);return !n||f.some(x=>arN(x).includes(n))};

/* مفتاح '_' = المدارس التابعة للمقاطعة مباشرة (بلا بلدية) */
function cmnAll(){
  const out=[];const direct=DB.schools.filter(s=>!s.communeId);
  if(direct.length)out.push({id:'_',name:'تابعة للمقاطعة مباشرة',c:null,list:direct});
  DB.communes.forEach(c=>out.push({id:c.id,name:c.name,c,list:DB.schools.filter(s=>s.communeId===c.id)}));
  return out;
}
const cmnGet=id=>cmnAll().find(g=>g.id===id)||(id==='_'?{id:'_',name:'تابعة للمقاطعة مباشرة',c:null,list:[]}:null);
function cmnStats(list,d){
  return list.reduce((a,s)=>{const t=schoolStats(s.id,d);a.schools++;a.classes+=t.classes;a.students+=t.students;a.teachers+=t.teachers;a.sAbs+=t.sAbs;a.tAbs+=t.tAbs;if(!t.done)a.pend++;return a},{schools:0,classes:0,students:0,teachers:0,sAbs:0,tAbs:0,pend:0});
}

/* ---------- مكوّن «قائمة اختيار بحثية» على شكل زر ---------- */
function pkr(k,label,ph,opts,val){
  const open=S.pk===k,cur=opts.find(o=>o[0]===val),srch=opts.length>5;
  return `<div class="pkw"><span class="pkt">${label}</span>
  <button type="button" class="pkb ${cur?'':'ph'}" data-a="pkopen" data-k="${k}" aria-haspopup="listbox" aria-expanded="${open}"><span class="pkv">${esc(cur?cur[1]:ph)}</span><i aria-hidden="true">▾</i></button>
  ${open?`<div class="pkp" role="listbox">${srch?'<input type="search" class="pks" data-i="pks" placeholder="🔍 ابحث…" autocomplete="off">':''}<div class="pkl">${opts.map(o=>`<button type="button" role="option" class="pko ${o[0]===val?'on':''}" aria-selected="${o[0]===val}" data-a="pkpick" data-k="${k}" data-v="${esc(o[0])}" data-q="${esc(arN(o[1]+' '+(o[3]||'')))}"><span>${esc(o[1])}</span>${o[2]?`<small>${esc(o[2])}</small>`:''}</button>`).join('')}<div class="pke" hidden>لا توجد نتائج</div></div></div>`:''}</div>`;
}
const nSch=n=>n+' '+(n===1?'مدرسة':'مدارس');
const depOpts=()=>[['dep',ORG.ar.dep,nSch(DB.schools.length)]];
const cmnOpts=()=>cmnAll().map(g=>[g.id,g.c?g.name:'المدارس التابعة للمقاطعة مباشرة',nSch(g.list.length)]);
const schOpts=g=>g.list.map(s=>[s.id,s.name,[s.village,s.director?'المدير: '+s.director:''].filter(Boolean).join(' · '),s.village+' '+s.director]);
const statChips=st=>`<span class="chip">🏫 <b>${st.schools}</b> ${st.schools===1?'مدرسة':'مدارس'}</span><span class="chip">🎓 <b>${st.students}</b> تلميذ</span><span class="chip">👨‍🏫 <b>${st.teachers}</b> ${st.teachers===1?'معلم':'معلمين'}</span><span class="chip ${st.sAbs?'warn':''}">📝 غياب اليوم: <b>${st.sAbs}</b> تلميذ · <b>${st.tAbs}</b> ${st.tAbs===1?'معلم':'معلمين'}</span>${st.pend?`<span class="chip warn">⏳ ${st.pend} لم تعتمد الغياب</span>`:''}`;

/* ---------- الصفحة: ثلاث قوائم + ملخص ما اختير ---------- */
function structureView(){
  const ed=U.role==='inspector';
  if(S.cmn&&!cmnGet(S.cmn))S.cmn=null;
  const g=S.dep&&S.cmn?cmnGet(S.cmn):null;
  let h=`<div class="card"><div class="row"><div><h2>🏘️ البلديات والمدارس</h2><small>المقاطعة ← البلدية ← المدرسة ← ملف المدرسة</small></div></div>
  ${pkr('dep','المقاطعة','اختر المقاطعة',depOpts(),S.dep||'')}
  ${S.dep?pkr('cmn','البلدية','اختر البلدية',cmnOpts(),S.cmn||''):''}
  ${g?pkr('sch','المدرسة','اختر المدرسة',schOpts(g),''):''}
  ${ed?`<div class="acts noprint"><button class="btn gold" data-a="addcommune">➕ إضافة بلدية</button><button class="btn pri" data-a="addschool" data-cm="${g&&g.c?g.c.id:''}">➕ إضافة مدرسة</button></div>`:'<div class="ro">👁️ عرض فقط — الإضافة والتعديل من صلاحيات المفتش</div>'}</div>`;
  if(!S.dep)return h+`<div class="card hint"><small>👆 اختر المقاطعة فتظهر قائمة البلديات، ثم اختر البلدية فتظهر قائمة مدارسها، ثم اختر المدرسة لفتح ملفها.</small></div>`;
  if(!g){
    const st=cmnStats(DB.schools,today()),n=DB.communes.length;
    return h+`<div class="card"><h3>🏛️ ${esc(ORG.ar.dep)}</h3><div class="cmnk"><span class="chip">🏘️ <b>${n}</b> ${n===1?'بلدية':'بلديات'}</span>${statChips(st)}</div><small>اختر البلدية من القائمة أعلاه.</small></div>`;
  }
  const st=cmnStats(g.list,today());
  return h+`<div class="card"><h3>${g.c?'🏘️':'🏛️'} ${esc(g.c?g.name:'المدارس التابعة للمقاطعة مباشرة')}</h3><div class="cmnk">${statChips(st)}</div>
  ${ed&&g.c?`<div class="acts noprint"><button class="btn sm sec" data-a="editcommune" data-id="${g.c.id}">✏️ تعديل البلدية</button><button class="btn sm dan" data-a="delcommune" data-id="${g.c.id}">🗑️ حذف</button></div>`:''}
  <small>${g.list.length?'اختر المدرسة من القائمة أعلاه لفتح ملفها.':'لا توجد مدارس هنا بعد.'+(ed?' أضف مدرسة بزر «إضافة مدرسة».':'')}</small></div>`;
}

const pkClose=()=>{if(!S.pk)return;S.pk=null;document.querySelectorAll('.pkp').forEach(x=>x.remove());document.querySelectorAll('.pkb[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'))};
const STACT={
  pkopen(el){const k=el.dataset.k;S.pk=S.pk===k?null:k;render();const i=$('.pks');if(i)i.focus();const p=$('.pkp');if(p&&p.scrollIntoView)p.scrollIntoView({block:'nearest'})},
  pkpick(el){
    const k=el.dataset.k,v=el.dataset.v;S.pk=null;
    if(k==='dep'){if(v!==S.dep)S.cmn=null;S.dep=v}
    else if(k==='cmn'){S.cmn=v}
    else if(k==='sch'){if(canView(v)){go('school',{sid:v,tab:'over'});return}}
    render();
  },
  /* من ملف المدرسة نرجع إلى صفحة بلديتها وقد اختيرت المقاطعة والبلدية */
  backcmn(){const s=school(S.sid);S.dep='dep';S.cmn=s?(s.communeId||'_'):null;S.pk=null;go('structure')}
};
document.addEventListener('click',e=>{if(S.pk&&!e.target.closest('.pkw'))pkClose()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')pkClose()});
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||el.dataset.i!=='pks')return;
  const q=arN(el.value),box=el.closest('.pkp');if(!box)return;let n=0;
  box.querySelectorAll('.pko').forEach(b=>{const m=!q||b.dataset.q.includes(q);b.hidden=!m;if(m)n++});
  const z=box.querySelector('.pke');if(z)z.hidden=n>0;
});

const AWRE=/[ء-غف-ٰٟـ]+/g,HASAR=/[ء-ي]/;
function trStr(s){

const periodLabel=p=>p==='y'?'المعدل السنوي (الامتحانات الثلاثة)':EXAMS[p];
/* ===== نموذج الكشوف المدرسية (مطابق لنموذج «المنصة المدرسية»): كشف القسم A4 عموديًا + كشف فردي، اثنان في كل صفحة ===== */
const EXT={e1:'امتحان الفصل الأول',e2:'امتحان الفصل الثاني',e3:'امتحان الفصل الثالث',y:'المعدل السنوي للامتحانات الثلاثة'};
const KPG=20; /* عدد التلاميذ في صفحة كشف القسم */

const totY=id=>{const v=['e1','e2','e3'].map(k=>examTot(id,k)).filter(x=>x!=null);return v.length?r2(v.reduce((a,b)=>a+b,0)/v.length):null};

function sheetHTML(sid,cid,p){
  const sc=school(sid),c=DB.classes.find(x=>x.id===cid),ss=clsStu(cid),rk=rankMap(ss,p),Y=p==='y',sch=schCls(cid,Y?'e1':p);
  const vals=ss.map(s=>avgFor(s.id,p)).filter(v=>v!=null),pass=vals.filter(v=>v>=10).length,boys=ss.filter(s=>s.sex==='M').length;
  const rate=ss.length?Math.round(pass*100/ss.length):0,rot=t=>`<th><div class="rot">${t}</div></th>`;
  const head=`<tr>${rot('الرتبة')}${rot('رقم النداء')}<th class="knm">الاسم الكامل</th>${rot('الرقم المدرسي')}`+
    (Y?['e1','e2','e3'].map(k=>rot(`${EXAMS[k]} / 20`)).join('')+rot('المعدل السنوي / 20')
      :sch.map(x=>rot(`${esc(x.n)} / ${x.mx}`)).join('')+rot(`المجموع / ${schMx(sch)}`)+rot('المعدل / 20'))+rot('النتيجة')+'</tr>';
  const cols=Y?[5,5,26,14,10,10,10,12,8]:[4,4,21,10].concat(sch.map(()=>(43.2/sch.length)),[5,5,7.5]);
  /* كشف الدرجات مرتّب بالرتبة (الأول فالثاني…)، ولكل تلميذ رقم ندائه الثابت في القسم؛ المتساوون بحسب رقم النداء ومن لا علامات له في الآخر */
  const rows=ss.map(s=>({s,cn:s.cn})).sort((a,b)=>((rk[a.s.id]||9999)-(rk[b.s.id]||9999))||(a.cn-b.cn)).map(({s,cn})=>{const v=avgFor(s.id,p),m=(DB.marks[s.id]||{})[p]||{};
    const mid=Y?['e1','e2','e3'].map(k=>`<td>${fmtM(examAvg(s.id,k))}</td>`).join('')+`<td><b>${fmtM(v)}</b></td>`
      :sch.map(x=>`<td>${fmtM(m[x.id])}</td>`).join('')+`<td>${fmtM(examTot(s.id,p))}</td><td><b>${fmtM(v)}</b></td>`;
    return `<tr><td>${rk[s.id]||'—'}</td><td>${cn}</td><td class="knm">${esc(dn(s))}</td><td>${esc(s.no||'—')}</td>${mid}<td class="kr">${resCell(v)}</td></tr>`});
  const np=Math.max(1,Math.ceil(rows.length/KPG)),tn=DB.teachers.filter(t=>t.cids.indexOf(cid)>-1).map(t=>t.name).join('، '),t2=(a,f)=>LG==='fr'?f:a;
